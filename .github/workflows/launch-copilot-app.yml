name: Launch Copilot App

on:
  repository_dispatch:
    types: [launch_copilot_app]
  workflow_dispatch:
    inputs:
      app:
        description: App to launch
        required: true
        type: choice
        options:
          - openbot
          - opendots

permissions:
  contents: read

concurrency:
  group: copilot-runtime-${{ github.event.client_payload.app || inputs.app }}
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      APP: ${{ github.event.client_payload.app || inputs.app }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      METODBOX_API_KEY: ${{ secrets.API_KEY }}
      CPK_INTELLIGENCE_API_KEY: ${{ secrets.CPK_INTELLIGENCE_API_KEY }}
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install launcher dependencies
        run: npm install --no-audit --no-fund

      - name: Launch selected app
        run: bash github-runtime/launch-copilot-app.sh "$APP"
