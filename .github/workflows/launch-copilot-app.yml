name: Legacy OpenDots/OpenBot (Retired)

# Metodbox Dot is always available at the existing Cloudflare Worker /dot.
# Keeping this tombstone workflow prevents old repository_dispatch events
# from consuming runners or restoring retired CopilotKit applications.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Use native Metodbox Dot
        run: |
          echo "::notice::OpenDots/OpenBot runners have been retired. Use the native Cloudflare Dot."
          echo "https://metodbox-direct-api.hanefimert2016.workers.dev/dot"
