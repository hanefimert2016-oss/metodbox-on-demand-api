name: Test Dot Desktop Vision Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-dot-desktop-vision.yml"

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - name: Check whether the existing GPT+ gateway accepts image inputs
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          if(!process.env.API_KEY)throw Error("API_KEY is missing");
          const {deflateSync}=await import("node:zlib");
          const width=64,height=64;
          const crc32=buf=>{
            let crc=0xffffffff;
            for(const b of buf){crc^=b;for(let j=0;j<8;j++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}
            return (crc^0xffffffff)>>>0;
          };
          const chunk=(tag,data)=>{
            const label=Buffer.from(tag),length=Buffer.alloc(4),sum=Buffer.alloc(4);
            length.writeUInt32BE(data.length);sum.writeUInt32BE(crc32(Buffer.concat([label,data])));
            return Buffer.concat([length,label,data,sum]);
          };
          const ihdr=Buffer.alloc(13);
          ihdr.writeUInt32BE(width,0);ihdr.writeUInt32BE(height,4);ihdr[8]=8;ihdr[9]=6;
          const rows=Buffer.alloc(height*(width*4+1));
          for(let y=0;y<height;y++)for(let x=0;x<width;x++){
            const i=y*(width*4+1)+1+x*4;
            rows[i]=42;rows[i+1]=104;rows[i+2]=207;rows[i+3]=255;
          }
          const png=Buffer.concat([
            Buffer.from([137,80,78,71,13,10,26,10]),
            chunk("IHDR",ihdr),
            chunk("IDAT",deflateSync(rows)),
            chunk("IEND",Buffer.alloc(0))
          ]);
          const pixel=png.toString("base64");
          console.log("Generated validated 64x64 RGBA PNG bytes:",png.length);
          const result=await fetch("https://metodbox-direct-api.hanefimert2016.workers.dev/v1/chat/completions",{
            method:"POST",
            headers:{"Authorization":"Bearer "+process.env.API_KEY,"Content-Type":"application/json"},
            body:JSON.stringify({model:"gpt-5.1",stream:false,max_tokens:75,
              messages:[{role:"user",content:[
                {type:"text",text:"Briefly describe whether an image was attached."},
                {type:"image_url",image_url:{url:"data:image/png;base64,"+pixel}}
              ]}]
            }),signal:AbortSignal.timeout(90000)
          });
          if(!result.ok){
            const response=await result.text();
            console.log("DESKTOP_VISION_UNSUPPORTED HTTP",result.status,response.slice(0,220));
            // This model capability is optional. Never break existing text/PC use.
          }else{
            const data=await result.json();
            const text=data?.choices?.[0]?.message?.content;
            console.log("DESKTOP_VISION_ACCEPTED",Boolean(String(text||"").trim()),"response_chars",String(text||"").length);
          }
          JS
