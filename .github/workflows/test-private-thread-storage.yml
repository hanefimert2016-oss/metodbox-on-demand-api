name: Test Private Thread and Agent Storage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-direct/src/threadhub.js"
      - "github-runtime/storage-git.sh"
      - "github-runtime/launch-agent-pc.sh"
      - "github-runtime/launch-copilot-app.sh"
      - "github-runtime/setup-private-storage.sh"
      - "github-runtime/setup-termux.sh"
      - "github-runtime/fix-secrets-termux.sh"
      - "github-runtime/configure-voice-termux.sh"
      - "github-runtime/tests/threadhub-storage.test.mjs"
      - "github-runtime/tests/portal-login.test.mjs"
      - "cloudflare-direct/src/portal.js"
      - "cloudflare-direct/src/dot.js"
      - "cloudflare-direct/src/dot-stream.js"
      - "github-runtime/tests/dot-stream.test.mjs"
      - "cloudflare-direct/src/dot-agents.js"
      - "cloudflare-direct/src/dot-team-ui.js"
      - "github-runtime/tests/dot-multiagent.test.mjs"
      - "cloudflare-direct/src/dot-ui.js"
      - "cloudflare-direct/src/edge-tts.js"
      - "cloudflare-direct/src/index.js"
      - "github-runtime/tests/dot-native.test.mjs"
      - ".github/workflows/test-private-thread-storage.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript and shell syntax
        run: |
          node --check cloudflare-direct/src/threadhub.js
          node --check cloudflare-direct/src/portal.js
          node --check cloudflare-direct/src/dot.js
          node --check cloudflare-direct/src/dot-stream.js
          node --check cloudflare-direct/src/dot-agents.js
          node --check cloudflare-direct/src/dot-team-ui.js
          node --check cloudflare-direct/src/dot-ui.js
          node --check cloudflare-direct/src/edge-tts.js
          node --check cloudflare-direct/src/index.js
          bash -n github-runtime/storage-git.sh
          bash -n github-runtime/launch-agent-pc.sh
          bash -n github-runtime/launch-copilot-app.sh
          bash -n github-runtime/setup-private-storage.sh
          bash -n github-runtime/setup-termux.sh
          bash -n github-runtime/fix-secrets-termux.sh
          bash -n github-runtime/configure-voice-termux.sh
      - name: Mock GitHub API tests
        run: node --test github-runtime/tests/threadhub-storage.test.mjs github-runtime/tests/portal-login.test.mjs github-runtime/tests/dot-native.test.mjs github-runtime/tests/dot-multiagent.test.mjs github-runtime/tests/dot-stream.test.mjs
