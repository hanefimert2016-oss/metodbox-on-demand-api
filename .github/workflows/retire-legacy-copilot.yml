name: Retire Legacy CopilotKit App Runners

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-legacy-copilot.yml"

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Stop old OpenDots / OpenBot runner, keep private data
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Existing Cloudflare API token missing}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Existing Cloudflare account ID missing}"
          KV="3e17fc451bea47958bc5d9456964d95b"
          for app in opendots openbot; do
            npx wrangler kv key put --namespace-id="$KV" "copilot_stop:$app" "1" --remote
            echo "Stop requested for legacy $app."
          done
          echo "Native /dot is Cloudflare-hosted and does not need app runners." >> "$GITHUB_STEP_SUMMARY"
          echo "The original GPT+ API, agent PC workflow and private Metodbox-secret-system remain unchanged." >> "$GITHUB_STEP_SUMMARY"
