name: Configure Private Thread Storage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Metodbox Worker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate single GitHub token and PRIVATE storage repo
        env:
          GH_TOKEN: ${{ secrets.AGENT_STORAGE_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?One GitHub PAT (AGENT_STORAGE_TOKEN) is missing}"
          for repo in hanefimert2016-oss/Metodbox-secret-system hanefimert2016-oss/metodbox-on-demand-api; do
            gh api "repos/$repo" --jq .full_name
          done
          visibility="$(gh api repos/hanefimert2016-oss/Metodbox-secret-system --jq '.private')"
          if [ "$visibility" != "true" ]; then
            echo "::error::Metodbox-secret-system is PUBLIC; make it PRIVATE before proceeding."
            exit 1
          fi
          gh api repos/hanefimert2016-oss/Metodbox-secret-system/branches/agent-data --jq .name
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Configure secrets on existing Cloudflare Worker (NO ngrok)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONE_GITHUB_PAT: ${{ secrets.AGENT_STORAGE_TOKEN }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          PORTAL_SESSION_SECRET: ${{ secrets.PORTAL_SESSION_SECRET }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Existing Cloudflare API token missing}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Existing Cloudflare account ID missing}"
          : "${ONE_GITHUB_PAT:?Single GitHub PAT missing}"
          : "${PORTAL_PASSWORD:?Portal password secret missing}"
          : "${PORTAL_SESSION_SECRET:?Portal signing key secret missing}"
          : "${STORAGE_ENCRYPTION_KEY:?Data encryption key secret missing}"
          printf '%s' "$ONE_GITHUB_PAT" | npx wrangler secret put GITHUB_STORAGE_TOKEN
          printf '%s' "$ONE_GITHUB_PAT" | npx wrangler secret put GITHUB_TRIGGER_TOKEN
          printf '%s' 'hanefimert2016-oss/Metodbox-secret-system' | npx wrangler secret put GITHUB_STORAGE_REPO
          printf '%s' 'agent-data' | npx wrangler secret put GITHUB_STORAGE_BRANCH
          printf '%s' 'hanefimert2016-oss/metodbox-on-demand-api' | npx wrangler secret put GITHUB_LAUNCH_REPO
          printf '%s' 'admin' | npx wrangler secret put PORTAL_USERNAME
          printf '%s' "$PORTAL_PASSWORD" | npx wrangler secret put PORTAL_PASSWORD
          printf '%s' "$PORTAL_SESSION_SECRET" | npx wrangler secret put PORTAL_SESSION_SECRET
          printf '%s' "$STORAGE_ENCRYPTION_KEY" | npx wrangler secret put STORAGE_ENCRYPTION_KEY
          npx wrangler deploy
          {
            echo "## Metodbox Cloudflare private storage configured"
            echo
            echo "Main code: hanefimert2016-oss/metodbox-on-demand-api"
            echo "Encrypted storage: hanefimert2016-oss/Metodbox-secret-system @ agent-data"
            echo "Portal: https://metodbox-direct-api.hanefimert2016.workers.dev/apps"
            echo "ngrok: not used"
          } >> "$GITHUB_STEP_SUMMARY"
