name: MİRAS Cloudflare domain and fallback diagnostics
on:
  push:
    branches: [miras-workers-20261105]
    paths:
      - '.github/workflows/miras-domain-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check usable Cloudflare custom domains without changing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          const token=process.env.CLOUDFLARE_API_TOKEN,acct=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!acct){console.log('Cloudflare token or account ID unavailable');process.exit(0);}
          for(const [label,url] of [
            ['zone_names','https://api.cloudflare.com/client/v4/zones?per_page=50'],
            ['pages_projects',`https://api.cloudflare.com/client/v4/accounts/${acct}/pages/projects?per_page=50`]
          ]){
            try {
              const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
              const j=await r.json();
              if(!r.ok || !j.success){console.log(label,'read_unavailable',r.status,(j.errors||[]).map(x=>x.code).join(','));continue;}
              console.log(label,'available',Array.isArray(j.result)?j.result.map(x=>x.name).filter(Boolean).join(' | '):'non-array');
            }catch(e){console.log(label,'error',e.name);}
          }
          EOF
      - name: Check falconos.tech custom hostname availability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const a=await (await fetch('https://api.cloudflare.com/client/v4/zones?name=falconos.tech',{headers})).json();
          const zone=a.result?.find(z=>z.name==='falconos.tech');
          if(!zone){console.log('Zone is not accessible');process.exit(1)}
          console.log('zone_status:',zone.status);
          const b=await fetch('https://api.cloudflare.com/client/v4/zones/'+zone.id+'/dns_records?name=miras.falconos.tech',{headers});
          const j=await b.json();
          console.log('dns_records_readable:',j.success,'count:',j.result?.length??'not-authorized');
          if(j.result?.length) console.log('existing_dns_record_types:',j.result.map(v=>v.type).join(','));
          EOF
