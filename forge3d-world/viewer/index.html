<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as T from "three";import{OrbitControls}from "three/addons/controls/OrbitControls.js";import{GLTFLoader}from "three/addons/loaders/GLTFLoader.js";
const s=new T.Scene();s.background=new T.Color("#071019");const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,750);c.position.set(106,95,115);
const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.target.set(0,3,0);s.add(new T.HemisphereLight(0xc3efff,0x17202b,2.1));
const l=new T.DirectionalLight(0xffffff,3);l.position.set(65,110,95);s.add(l);
new GLTFLoader().load("../outputs/AEGIS_Outpost.glb",g=>{s.add(g.scene);document.getElementById("status").textContent="REAL GLB LOADED"},undefined,e=>{document.getElementById("status").textContent="GLB missing: run generate.py";console.error(e)});
addEventListener("resize",()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{o.update();r.render(s,c)});
</script>
